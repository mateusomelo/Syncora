<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada · Syncora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#12141a; --text-dim:#8b8f99; --accent:#3b5bff; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background: var(--ink); color:#fff; position: relative; overflow: hidden;
  }
  .bg-glow { position:absolute; inset:0; background-image: radial-gradient(circle at 30% 30%, rgba(59,91,255,.25), transparent 45%); }
  .box { position: relative; z-index: 1; text-align:center; padding:2rem; }
  .code { font-family:'Sora',sans-serif; font-size: 72px; font-weight: 800; color: var(--accent); margin: 0 0 8px; }
  h1 { font-family:'Sora',sans-serif; font-size:20px; margin:0 0 8px; }
  p { color:var(--text-dim); margin:0 0 24px; font-size: 14.5px; }
  a { display:inline-block; background: var(--accent); color:#fff; text-decoration:none; padding:10px 20px; border-radius:10px; font-size:14px; font-weight:600; box-shadow: 0 8px 24px rgba(59,91,255,.3); }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="box">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>Esse endereço não existe no site do Syncora.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
