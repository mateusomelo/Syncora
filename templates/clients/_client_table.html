<div id="client-table-wrapper">
<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-left text-gray-500">
      <tr>
        <th class="px-4 py-3">Nome</th>
        <th class="px-4 py-3">Telefone</th>
        <th class="px-4 py-3">E-mail</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for client in clients %}
      <tr>
        <td class="px-4 py-3 font-medium">
          <a href="{% url 'clients:detail' client.pk %}" class="hover:underline">{{ client.name }}</a>
        </td>
        <td class="px-4 py-3 text-gray-500">{{ client.phone|default:"—" }}</td>
        <td class="px-4 py-3 text-gray-500">{{ client.email|default:"—" }}</td>
        <td class="px-4 py-3 text-right space-x-3">
          <a href="{% url 'clients:update' client.pk %}" class="text-gray-900 hover:underline">Editar</a>
          <button
            hx-post="{% url 'clients:delete' client.pk %}"
            hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="Remover {{ client.name }}?"
            class="text-red-600 hover:underline">Remover</button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400">Nenhum cliente encontrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</div>
