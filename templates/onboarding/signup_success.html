{% extends "base.html" %}
{% block title %}Empresa criada · Syncora{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 text-center">
  <div class="max-w-md">
    <h1 class="text-2xl font-semibold mb-2">Sua empresa foi criada! 🎉</h1>
    <p class="text-sm text-gray-500 mb-6">Acesse pelo endereço abaixo com o e-mail e a senha que você acabou de cadastrar.</p>
    <a href="http://{{ subdomain }}.{{ tenant_base_domain }}/auth/login/" class="inline-block rounded-lg bg-gray-900 text-white px-6 py-3 font-medium hover:bg-gray-800">
      {{ subdomain }}.{{ tenant_base_domain }}
    </a>
  </div>
</div>
{% endblock %}
