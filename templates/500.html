<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro interno · Syncora</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f2ec; color: #211f1a;
        }
        @media (prefers-color-scheme: dark) { body { background: #15161a; color: #eae6dd; } }
        .box { text-align: center; padding: 2rem; max-width: 28rem; }
        .code { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a8402f; margin-bottom: 12px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { font-size: 15px; color: #6b6459; margin: 0 0 24px; }
        a { display: inline-block; background: #17181d; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">Erro 500</div>
        <h1>Algo deu errado do nosso lado</h1>
        <p>Já fomos notificados automaticamente. Tente novamente em alguns instantes.</p>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
