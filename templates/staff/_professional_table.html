<div id="professional-table-wrapper">
<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-left text-gray-500">
      <tr>
        <th class="px-4 py-3">Nome</th>
        <th class="px-4 py-3">Especialidades</th>
        <th class="px-4 py-3">Status</th>
        <th class="px-4 py-3"></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for professional in professionals %}
      <tr>
        <td class="px-4 py-3 font-medium">
          <a href="{% url 'staff:detail' professional.pk %}" class="hover:underline">{{ professional.name }}</a>
        </td>
        <td class="px-4 py-3 text-gray-500">{{ professional.specialties|default:"—" }}</td>
        <td class="px-4 py-3">
          <span class="inline-block rounded-full px-2 py-0.5 text-xs {% if professional.status == 'active' %}bg-green-100 text-green-700{% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ professional.get_status_display }}
          </span>
        </td>
        <td class="px-4 py-3 text-right space-x-3">
          <a href="{% url 'staff:update' professional.pk %}" class="text-gray-900 hover:underline">Editar</a>
          <button
            hx-post="{% url 'staff:delete' professional.pk %}"
            hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="Remover {{ professional.name }}?"
            class="text-red-600 hover:underline">Remover</button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400">Nenhum profissional cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</div>
