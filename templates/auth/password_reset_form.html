{% extends "base.html" %}
{% block title %}Redefinir senha · Syncora{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-semibold mb-2 text-center">Redefinir senha</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">Informe seu e-mail para receber o link de redefinição.</p>
    <form method="post" class="space-y-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium mb-1" for="{{ form.email.id_for_label }}">E-mail</label>
        {{ form.email }}
      </div>
      <button type="submit" class="w-full rounded-lg bg-gray-900 text-white py-2 font-medium hover:bg-gray-800 transition">
        Enviar link
      </button>
    </form>
  </div>
</div>
<style type="text/tailwindcss">
  input[type=email] { @apply w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900; }
</style>
{% endblock %}
