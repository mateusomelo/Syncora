{% extends "base.html" %}
{% block title %}Entrar · Syncora{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-semibold mb-6 text-center">Entrar no Syncora</h1>
    <form method="post" class="space-y-4 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="text-sm text-red-600">{{ form.non_field_errors }}</div>
      {% endif %}
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700" for="{{ form.username.id_for_label }}">E-mail</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700" for="{{ form.password.id_for_label }}">Senha</label>
        <div class="relative">
          {{ form.password }}
          <button type="button" onclick="const f=document.getElementById('{{ form.password.id_for_label }}'); f.type = f.type === 'password' ? 'text' : 'password'; this.textContent = f.type === 'password' ? 'Mostrar' : 'Ocultar';" class="absolute inset-y-0 right-0 px-3 text-xs font-medium text-gray-500 hover:text-gray-900">Mostrar</button>
        </div>
      </div>
      <button type="submit" class="w-full rounded-lg bg-gray-900 text-white py-2 font-medium hover:bg-gray-800 transition">
        Entrar
      </button>
      <div class="text-sm text-center">
        <a href="{% url 'authentication:password_reset' %}" class="text-gray-500 hover:text-gray-900">Esqueceu a senha?</a>
      </div>
    </form>
  </div>
</div>
<style type="text/tailwindcss">
  input[type=email], input[type=password], input[type=text] {
    @apply w-full rounded-lg border border-gray-300 px-3 py-2 pr-16 text-sm text-gray-900 placeholder-gray-400 bg-white focus:outline-none focus:ring-2 focus:ring-gray-900;
  }
</style>
{% endblock %}
