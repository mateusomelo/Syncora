{% extends "base.html" %}
{% block title %}Anamnese · {{ client.name }} · Syncora{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto py-10 px-4">
  <h1 class="text-2xl font-semibold mb-6">Anamnese · {{ client.name }}</h1>
  <form method="post" class="space-y-4 bg-white p-6 rounded-xl border border-gray-200">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors|join:", " }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full rounded-lg bg-gray-900 text-white py-2 font-medium hover:bg-gray-800">Salvar</button>
  </form>
</div>
<style type="text/tailwindcss">
  textarea { @apply w-full rounded-lg border border-gray-300 px-3 py-2 text-sm; }
</style>
{% endblock %}
