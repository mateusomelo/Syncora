{% extends "base.html" %}
{% block title %}Relatórios · Syncora{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-10 px-4">
  <h1 class="text-2xl font-semibold mb-6">Relatórios</h1>
  <div class="grid gap-4">
    <a href="{% url 'reports:appointments' %}" class="bg-white border border-gray-200 rounded-xl p-6 hover:border-gray-300">
      <h2 class="font-medium">Agendamentos</h2>
      <p class="text-sm text-gray-500">Lista de atendimentos por período, com cancelamentos.</p>
    </a>
    <a href="{% url 'reports:financial' %}" class="bg-white border border-gray-200 rounded-xl p-6 hover:border-gray-300">
      <h2 class="font-medium">Financeiro</h2>
      <p class="text-sm text-gray-500">Receitas e despesas do período.</p>
    </a>
    <a href="{% url 'reports:commissions' %}" class="bg-white border border-gray-200 rounded-xl p-6 hover:border-gray-300">
      <h2 class="font-medium">Comissões</h2>
      <p class="text-sm text-gray-500">Comissões por profissional no período.</p>
    </a>
  </div>
</div>
{% endblock %}
