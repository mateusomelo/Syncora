services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-syncora}
      POSTGRES_USER: ${DB_USER:-syncora_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncora_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
